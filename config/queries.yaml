# Search configuration for the scout agent.
#
# Edit freely. After week one, read what the scout kept and dropped and tune
# both the queries here and the rubric in config/relevance_rubric.md.
#
# Query strings are written in PubMed syntax. Europe PMC accepts them nearly
# verbatim; bioRxiv has no query API, so the scout fetches the date window and
# filters locally with the `preprint_keywords` list at the bottom.

settings:
  # How many days back each daily run looks. Overlap is intentional: dedup by
  # seen_ids.json makes re-seeing an article free, while a 1-day window would
  # drop papers indexed late.
  lookback_days: 2
  # Minimum relevance score to keep in new_articles.json.
  min_score: 3
  # Hard cap per query, to stop a badly-tuned query flooding a run. A 12-month
  # window holds several hundred hits for the broader queries (cargo_classes
  # alone returned 646), so a cap sized for a daily run silently truncates a
  # backfill. fetch.py warns whenever a query reaches this.
  max_per_query: 500
  # Hard cap on abstracts sent for scoring in one run. Override per-run with
  # --max-candidates rather than editing this; the default suits a daily run.
  max_total_candidates: 300

sources:
  pubmed:
    enabled: true
    base: https://eutils.ncbi.nlm.nih.gov/entrez/eutils
    api_key_env: NCBI_API_KEY   # optional; raises rate limit to 10 req/s
  europepmc:
    enabled: true
    base: https://www.ebi.ac.uk/europepmc/webservices/rest
    # FIRST_PDATE (first publication date) is assigned late: a 2-3 day window
    # on it returns nothing at all, while the same window a month back returns
    # hundreds. FIRST_IDATE (first index date) is when Europe PMC actually
    # ingested the record, which is what "new today" means here.
    date_field: FIRST_IDATE
    # Even FIRST_IDATE lags a few days, so this source gets its own, longer
    # window. Dedup makes the overlap free.
    lookback_days: 10
  biorxiv:
    enabled: true
    base: https://api.biorxiv.org
    servers: [biorxiv, medrxiv]
  openalex:
    enabled: false              # turn on if coverage feels thin
    base: https://api.openalex.org
  semantic_scholar:
    enabled: false              # recommendations API; key recommended
    base: https://api.semanticscholar.org/graph/v1

# ---------------------------------------------------------------------------
# Queries, grouped by intent. `weight` is a prior, not a score: it nudges the
# scout when an article sits between two rubric bands.
# ---------------------------------------------------------------------------

queries:
  core_platform:
    weight: 1.0
    items:
      - name: nanobody_cargo
        q: >-
          (nanobody OR VHH OR "single-domain antibody" OR sdAb)
          AND (delivery OR cargo OR conjugate OR payload)
      - name: adc_loading
        q: >-
          ("antibody-drug conjugate" OR "antibody conjugate")
          AND ("drug-to-antibody ratio" OR DAR OR "payload loading"
               OR "cargo capacity" OR "drug loading")
      - name: shuttle_bispecific
        q: >-
          (bispecific OR "brain shuttle" OR "transport vehicle" OR "molecular Trojan horse")
          AND (transcytosis OR "blood-brain barrier" OR "blood brain barrier")

  uptake_trafficking:
    weight: 1.0
    items:
      - name: rme_efficiency
        q: >-
          ("receptor-mediated endocytosis" OR transcytosis)
          AND (nanobody OR antibody) AND (efficiency OR uptake OR internalization)
      - name: endosomal_fate
        q: >-
          ("endosomal escape" OR "lysosomal degradation" OR "endosomal sorting"
           OR "endosomal release") AND (antibody OR nanobody)
      - name: fcrn
        q: >-
          (FcRn OR "Fc engineering") AND (transcytosis OR recycling OR half-life)
          AND delivery

  increasing_cargo:
    weight: 1.3   # this is the thesis of the project
    items:
      - name: valency_avidity
        q: >-
          (valency OR multivalent OR avidity OR "affinity tuning")
          AND (nanobody OR antibody) AND (uptake OR transcytosis OR delivery)
      - name: conjugation_chemistry
        q: >-
          ("site-specific conjugation" OR "high DAR" OR "multi-payload"
           OR "dendrimer linker" OR "branched linker" OR "polymer linker")
          AND (antibody OR nanobody)
      # "targeting"/"functionalized"/"loading" are generic enough to pull in AFM
      # tips, SERS immunoprobes, biosensors and nanovaccines. The added clause
      # requires the antibody to be ON the carrier, and the exclusions drop the
      # detection and vaccine literature. 29 -> 11 hits on the 2026-10-15
      # backfill, retaining all three of its keepers.
      - name: carrier_formats
        q: >-
          (nanobody OR antibody)
          AND (nanoparticle OR liposome OR "lipid nanoparticle" OR polymersome
               OR "extracellular vesicle")
          AND (conjugated OR conjugation OR functionalized OR decorated
               OR displayed OR immunoliposome OR "antibody-modified")
          AND (loading OR encapsulation OR delivery OR payload)
          NOT vaccine[ti] NOT biosensor[ti] NOT immunoassay[ti]
      # The cargo-class terms plus a bare antibody mention match any paper that
      # happens to discuss both (oligonucleotide-therapeutics reviews, even
      # bioanalysis microsampling). The third clause requires an actual
      # conjugation or delivery notion. On the 2026-10-15 backfill this cut the
      # query 42 -> 17 hits while retaining both of its keepers.
      - name: cargo_classes
        q: >-
          ("protein cargo" OR "enzyme replacement" OR oligonucleotide OR siRNA
           OR "antisense oligonucleotide" OR "antibody-oligonucleotide conjugate")
          AND (nanobody OR antibody)
          AND (conjugate OR conjugation OR payload OR cargo OR carrier
               OR delivery OR loading OR warhead)

  targets_and_shuttles:
    weight: 1.1   # extend with whatever targets you work on
    items:
      - name: brain_shuttle_receptors
        q: >-
          ("transferrin receptor" OR TfR1 OR CD98hc OR IGF1R OR "insulin receptor"
           OR LRP1 OR "basigin" OR CD98)
          AND (shuttle OR nanobody OR antibody) AND brain

# Applied to every PubMed/Europe PMC query. Reviews are not dropped outright;
# they are routed to a low-priority bucket by the scout.
filters:
  exclude_publication_types:
    - "case reports[pt]"
    - "editorial[pt]"
    - "comment[pt]"
    - "retracted publication[pt]"
  demote_publication_types:    # kept, but capped at score 2
    - "review[pt]"
    - "systematic review[pt]"
  # Title/abstract patterns that mark probable noise. Not an auto-reject: the
  # scout still scores, but starts one band lower unless there is loading,
  # uptake, or transit content.
  noise_patterns:
    - "phase (1|2|3|I|II|III) trial"
    - "overall survival"
    - "progression-free survival"
    - "retrospective cohort"
    - "real-world evidence"

# Used to filter the bioRxiv/medRxiv date window locally, since that API has no
# query support. The servers publish ~94,000 preprints a year, nearly all of it
# irrelevant here, so this filter decides what the scout ever sees.
#
# Rule (two branches, either one admits a preprint):
#   (strong_platform AND delivery)  OR  (platform AND tight_delivery)
#
# Why not simply require a strong platform term: measured against the 82
# preprints the 2026-10-15 backfill surfaced (6 of which the scout kept),
# strong-platform-only cut volume 82 -> 20 but LOST 2 of the 6 keepers,
# including a score-5 siRNA antibody-oligonucleotide conjugate paper that
# never says "nanobody" or "bispecific". The two-branch rule keeps 6/6 at
# 82 -> 57. That is a 30% cut rather than 75%, and the right trade: with only
# 6 known positives, precision bought by losing a top paper is a bad deal.
# Revisit once a few months of runs give a larger labelled set.
preprint_keywords:
  # A targeting-molecule format. Specific enough that a delivery word of any
  # kind alongside it is good evidence.
  strong_platform:
    [nanobody, VHH, "single-domain antibody", sdAb, bispecific, scFv,
     "antibody fragment", "antibody-drug conjugate", "antibody conjugate",
     immunoconjugate, ADC]
  # The generic terms ONLY. These match a large slice of immunology on their
  # own, so they admit a record only alongside tight_delivery. The specific
  # formats are not repeated here -- branch one already covers them with the
  # wider delivery list, so nothing is lost. Measured on the 82 labelled
  # preprints: listing the specific formats here too admits 72 and keeps 6/6;
  # restricting it to these two admits 60 and still keeps 6/6.
  platform:
    [antibody, immunoglobulin]
  # Any delivery-ish sense.
  delivery:
    [delivery, cargo, payload, conjugate, transcytosis, "blood-brain barrier",
     endocytosis, internalization, uptake, "endosomal escape", DAR, shuttle,
     encapsulation, loading, trafficking, FcRn]
  # Carries a cargo-or-transit sense specifically. Excludes uptake,
  # trafficking, internalization and endocytosis, which misfire constantly in
  # preprint titles -- thymocyte trafficking, rhodopsin trafficking, B-cell
  # uptake -- and are what let the generic "antibody" branch in.
  tight_delivery:
    [delivery, deliver, cargo, payload, conjugate, transcytosis,
     "blood-brain barrier", "endosomal escape", "drug-to-antibody", DAR,
     shuttle, encapsulat, loading, functionalized, warhead,
     "targeted nanoparticle"]


# Always surface anything from these, even without a keyword match, at score >=3
# with a "watchlist" tag. Fill in the labs and journals you want tracked.
watchlists:
  authors: []     # e.g. ["Watts RJ", "Muyldermans S"]
  journals: []    # e.g. ["Nat Biotechnol", "Sci Transl Med"]
  affiliations: []
